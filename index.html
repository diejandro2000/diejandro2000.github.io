<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de facturas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <button id="themeToggle">🌑</button>
  </header>

  <main>
    <h1>Generador de facturas</h1>

    <div id="invoice-form">

      <label for="clientSelect">Seleccionar cliente:</label>

      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
        <select id="clientSelect"></select>
        <button id="manageClients">👤 Gestionar clientes</button>
      </div>

      <input type="text" id="invoiceNumber" placeholder="Número de factura">
      <input type="date" id="invoiceDate">

      <div class="table-container">
        <table id="invoiceTable">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Lugar</th>
              <th>Actividad</th>
              <th>Inicio</th>
              <th>Final</th>
              <th>Horas</th>
              <th>Dieta</th>
              <th>Total (€)</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="invoiceItems"></tbody>
        </table>
      </div>

      <button id="addItem">➕ Añadir jornada</button>

      <h3 style="margin-top:30px;">🎛️ Equipo alquilado</h3>

      <table id="equipoTable">
        <thead>
          <tr>
            <th>Descripción</th>
            <th>Precio (€)</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="equipoItems"></tbody>
      </table>

      <button id="addEquipo">➕ Añadir equipo</button>

      <div class="summary">
        <div><strong>Subtotal:</strong> <span id="subtotal">0.00</span>€</div>
        <div><strong>IVA:</strong> <span id="ivaAmount">0.00</span>€</div>
        <div><strong>IRPF:</strong> <span id="irpfAmount">0.00</span>€</div>
        <div><strong>Total:</strong> <span id="grandTotal">0.00</span>€</div>
      </div>

      <div class="actions">
        <button id="generatePDF">📄 Descargar PDF</button>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
